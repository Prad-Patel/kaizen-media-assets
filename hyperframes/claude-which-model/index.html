<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"navy","type":"color","label":"Navy","default":"#0A1628"},
    {"id":"blue","type":"color","label":"Electric blue","default":"#2E7CF6"},
    {"id":"teal","type":"color","label":"Teal","default":"#34D3A6"},
    {"id":"red","type":"color","label":"Alert red","default":"#FF5A5F"},
    {"id":"paper","type":"color","label":"Paper","default":"#EAF0F9"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; font-weight: 700; src: url("assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Space Grotesk"; font-weight: 500; src: url("assets/fonts/space-grotesk-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "Kaizen Inter"; font-weight: 400; src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Kaizen Inter"; font-weight: 600; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Kaizen Inter"; font-weight: 800; src: url("assets/fonts/inter-latin-800-normal.woff2") format("woff2"); }
      :root {
        --navy: #0A1628;
        --blue: #2E7CF6;
        --teal: #34D3A6;
        --red: #FF5A5F;
        --paper: #EAF0F9;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 100%; height: 100%; }
      #bg { position: absolute; inset: 0; background: var(--paper); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <div id="bg"></div>

      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <div id="route" data-composition-id="route" data-composition-src="compositions/route.html"
        data-start="5" data-duration="20.6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="25.6" data-duration="4.4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <!-- Narration: ElevenLabs "Archer", trimmed and sped up 1.15x -->
      <audio id="vo-1" class="clip" src="assets/voice/line-1.mp3" data-duration="4.44" data-start="0.3" data-track-index="2" data-volume="1"></audio>
      <audio id="vo-2" class="clip" src="assets/voice/line-2.mp3" data-duration="5.67" data-start="5.25" data-track-index="2" data-volume="1"></audio>
      <audio id="vo-3" class="clip" src="assets/voice/line-3.mp3" data-duration="4.34" data-start="11.3" data-track-index="2" data-volume="1"></audio>
      <audio id="vo-4" class="clip" src="assets/voice/line-4.mp3" data-duration="4.49" data-start="15.95" data-track-index="2" data-volume="1"></audio>
      <audio id="vo-5" class="clip" src="assets/voice/line-5.mp3" data-duration="4.55" data-start="20.75" data-track-index="2" data-volume="1"></audio>
      <audio id="vo-6" class="clip" src="assets/voice/line-6.mp3" data-duration="2.30" data-start="26.0" data-track-index="2" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
